<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo opcional -->
  <rect width="500" height="200" rx="20" fill="none" />
  
  <!-- Icono de código -->
  <g transform="translate(50, 50)">
    <path d="M0 0 L40 0 L40 40 L0 40 Z" fill="url(#gradient)" filter="url(#glow)" opacity="0.9" />
    <path d="M10 10 L30 10 L30 30 L10 30 Z" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M15 15 L25 15" stroke="#00E5FF" stroke-width="2" />
    <path d="M15 20 L25 20" stroke="#00E5FF" stroke-width="2" />
    <path d="M15 25 L25 25" stroke="#00E5FF" stroke-width="2" />
  </g>
  
  <!-- Texto SBM TECH -->
  <g transform="translate(120, 80)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="48" font-weight="700" fill="#FFFFFF">
      SBM
    </text>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="48" font-weight="700" fill="url(#gradient)">
      TECH
    </text>
    
    <!-- Tagline -->
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="16" fill="#C0C0D8">
      Software & Business Management
    </text>
    <text x="0" y="120" font-family="'Inter', sans-serif" font-size="14" fill="#8888A0">
      Transformamos ideas en soluciones digitales
    </text>
  </g>
  
  <!-- Elemento decorativo -->
  <g transform="translate(400, 60)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="url(#gradient)" stroke-width="3" opacity="0.8" />
    <circle cx="20" cy="20" r="8" fill="#00E5FF" opacity="0.6" />
  </g>
</svg>
